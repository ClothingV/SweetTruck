<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Truck — Analytics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #18181a;
      --bg-secondary: #1e1e21;
      --bg-card: #232327;
      --bg-elevated: #2a2a2e;
      --accent: #d4be8a;
      --accent-light: #e2d0a4;
      --accent-dark: #b8a06a;
      --accent-glow: rgba(212,190,138,0.12);
      --text-primary: #f2f0ec;
      --text-secondary: #d8d6d2;
      --text-muted: #c0c0c4;
      --border: #2f2f33;
      --border-accent: rgba(212,190,138,0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--accent-dark) transparent; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 3px; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-primary); color: var(--text-primary); min-height: 100vh;
    }

    /* Floating Waffles Background */
    .waffle-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .waffle-icon {
      position: absolute; opacity: 0.5;
      animation: floatWaffle 20s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(212,190,138,0.15));
    }
    @keyframes floatWaffle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-30px) rotate(15deg); }
      50% { transform: translateY(-10px) rotate(-10deg); }
      75% { transform: translateY(-25px) rotate(8deg); }
    }

    /* Login */
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px; position: relative; z-index: 1;
    }
    .login-box {
      background: var(--bg-card); border: 1px solid var(--border-accent);
      border-radius: 20px; padding: 50px 40px; max-width: 480px; width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .login-logo { height: 56px; margin-bottom: 20px; }
    .login-greeting {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 600; color: var(--accent); margin-bottom: 6px;
    }
    .login-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px;
    }
    .login-title span { color: var(--accent); }
    .login-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    .login-input {
      width: 100%; padding: 14px 18px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg-secondary);
      color: var(--text-primary); font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.3s; margin-bottom: 12px;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-input::placeholder { color: var(--text-muted); }
    .login-btn {
      width: 100%; padding: 14px; border-radius: 50px; border: none;
      background: var(--accent); color: var(--bg-primary);
      font-size: 13px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; transition: all 0.3s;
      font-family: inherit;
    }
    .login-btn:hover { background: var(--accent-light); }
    .login-error {
      color: #e57373; font-size: 12px; margin-top: 10px; display: none;
    }

    /* Dashboard */
    .dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .dash-header-left { display: flex; align-items: center; gap: 12px; }
    .dash-logo { height: 36px; }
    .dash-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 600;
    }
    .dash-title span { color: var(--accent); }
    .dash-controls { display: flex; gap: 8px; align-items: center; }
    .dash-select {
      padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); font-size: 13px;
      font-family: inherit; cursor: pointer; outline: none;
    }
    .dash-select:focus { border-color: var(--accent); }
    .dash-logout {
      padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: 12px;
      cursor: pointer; transition: all 0.3s; font-family: inherit;
    }
    .dash-logout:hover { border-color: #e57373; color: #e57373; }

    /* Stat Cards */
    .stat-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border-accent);
      border-radius: 14px; padding: 18px 16px; text-align: center;
    }
    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; font-weight: 700; color: var(--accent);
    }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* Chart Cards */
    .chart-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 16px; margin-bottom: 24px;
    }
    .chart-card {
      background: var(--bg-card); border: 1px solid var(--border-accent);
      border-radius: 16px; padding: 20px;
    }
    .chart-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 600; color: var(--accent); margin-bottom: 14px;
    }
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap canvas { width: 100% !important; }

    /* Table */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      text-align: left; font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .data-table td {
      padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table .views-bar {
      display: inline-block; height: 6px; border-radius: 3px;
      background: var(--accent); margin-right: 8px; vertical-align: middle;
    }

    /* Loading */
    .loading {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
      font-size: 14px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 768px) {
      .dashboard { padding: 32px; }
      .chart-grid { grid-template-columns: 1fr 1fr; }
      .chart-grid .chart-full { grid-column: 1 / -1; }
    }
    @media (min-width: 1025px) {
      .dashboard { padding: 40px 60px; }
    }
  </style>
</head>
<body>

<!-- FLOATING WAFFLES BACKGROUND -->
<div class="waffle-bg" id="waffleBg"></div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img src="logo.png" alt="Sweet Truck" class="login-logo">
    <h1 class="login-greeting">Hallo Penelope</h1>
    <h2 class="login-title"><span>Analytics</span> Dashboard</h2>
    <p class="login-sub">Melden Sie sich an, um Ihre Website-Statistiken zu sehen.</p>
    <input type="password" class="login-input" id="passInput" placeholder="Passwort eingeben" autocomplete="off">
    <button class="login-btn" id="loginBtn">ANMELDEN</button>
    <p class="login-error" id="loginError">Falsches Passwort. Bitte erneut versuchen.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-header-left">
      <img src="logo.png" alt="Sweet Truck" class="dash-logo">
      <h1 class="dash-title"><span>Analytics</span> Dashboard</h1>
    </div>
    <div class="dash-controls">
      <select class="dash-select" id="daySelect">
        <option value="7">Letzte 7 Tage</option>
        <option value="30" selected>Letzte 30 Tage</option>
        <option value="90">Letzte 90 Tage</option>
      </select>
      <button class="dash-logout" id="logoutBtn">Abmelden</button>
    </div>
  </div>

  <div id="dashContent">
    <div class="loading">
      <div class="spinner"></div>
      Daten werden geladen...
    </div>
  </div>
</div>

<script>
(function() {
  let storedPass = '';
  let charts = {};

  const $ = id => document.getElementById(id);

  // Login
  $('loginBtn').addEventListener('click', doLogin);
  $('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('logoutBtn').addEventListener('click', () => {
    storedPass = '';
    $('dashboard').style.display = 'none';
    $('loginScreen').style.display = 'flex';
    $('passInput').value = '';
  });
  $('daySelect').addEventListener('change', () => loadData());

  function doLogin() {
    storedPass = $('passInput').value;
    if (!storedPass) return;
    $('loginError').style.display = 'none';
    loadData().then(ok => {
      if (ok === true) {
        $('loginScreen').style.display = 'none';
        $('dashboard').style.display = 'block';
      } else {
        if (ok !== 'error') $('loginError').textContent = 'Falsches Passwort. Bitte erneut versuchen.';
        $('loginError').style.display = 'block';
        storedPass = '';
      }
    });
  }

  async function loadData() {
    const days = $('daySelect').value;
    try {
      const res = await fetch('/api/stats?days=' + days, {
        headers: { 'x-analytics-pass': storedPass }
      });
      if (res.status === 401) return false;
      if (!res.ok) {
        var errData = await res.text();
        console.error('API Error:', res.status, errData);
        $('loginError').textContent = 'Server-Fehler: ' + res.status;
        return 'error';
      }
      var data = await res.json();
      renderDashboard(data);
      return true;
    } catch (e) {
      console.error(e);
      $('loginError').textContent = 'Verbindungsfehler: ' + e.message;
      return 'error';
    }
  }

  function renderDashboard(data) {
    const totalViews = data.totalViews || 0;
    const uniqueDays = (data.viewsPerDay || []).length;
    const avgPerDay = uniqueDays > 0 ? Math.round(totalViews / uniqueDays) : 0;
    const topPage = (data.topPages && data.topPages[0]) ? data.topPages[0].path : '-';

    $('dashContent').innerHTML = `
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-value">${totalViews.toLocaleString('de-DE')}</div>
          <div class="stat-label">Seitenaufrufe</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${avgPerDay.toLocaleString('de-DE')}</div>
          <div class="stat-label">Pro Tag</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${(data.topPages || []).length}</div>
          <div class="stat-label">Seiten besucht</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${(data.countries || []).length}</div>
          <div class="stat-label">Laender</div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card chart-full">
          <h3>Seitenaufrufe pro Tag</h3>
          <div class="chart-wrap"><canvas id="chartViews"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Geraete</h3>
          <div class="chart-wrap"><canvas id="chartDevices"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Browser</h3>
          <div class="chart-wrap"><canvas id="chartBrowsers"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Top Seiten</h3>
          ${renderTable(data.topPages || [], 'path')}
        </div>
        <div class="chart-card">
          <h3>Herkunft</h3>
          ${renderTable(data.referrers || [], 'referrer')}
        </div>
        <div class="chart-card chart-full">
          <h3>Laender</h3>
          ${renderTable(data.countries || [], 'country')}
        </div>
      </div>
    `;

    buildLineChart('chartViews', data.viewsPerDay || []);
    buildDoughnut('chartDevices', data.devices || [], 'device');
    buildDoughnut('chartBrowsers', data.browsers || [], 'browser');
  }

  function renderTable(rows, key) {
    if (!rows.length) return '<p style="color:var(--text-muted);font-size:13px;">Noch keine Daten.</p>';
    const max = Math.max(...rows.map(r => Number(r.views)));
    return `<table class="data-table">
      <thead><tr><th>${key === 'path' ? 'Seite' : key === 'referrer' ? 'Quelle' : 'Land'}</th><th>Aufrufe</th></tr></thead>
      <tbody>${rows.map(r => {
        const pct = max > 0 ? (Number(r.views) / max * 100) : 0;
        return `<tr>
          <td>${escHtml(r[key] || '-')}</td>
          <td><span class="views-bar" style="width:${pct}px"></span>${Number(r.views).toLocaleString('de-DE')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }

  function buildLineChart(id, rows) {
    const ctx = document.getElementById(id);
    if (!ctx) return;
    const labels = rows.map(r => {
      const d = new Date(r.day);
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    });
    const values = rows.map(r => Number(r.views));
    new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: '#d4be8a',
          backgroundColor: 'rgba(212,190,138,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: '#d4be8a',
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#c0c0c4', font: { size: 10 } }, grid: { color: 'rgba(47,47,51,0.6)' } },
          y: { beginAtZero: true, ticks: { color: '#c0c0c4', font: { size: 10 } }, grid: { color: 'rgba(47,47,51,0.6)' } }
        }
      }
    });
  }

  function buildDoughnut(id, rows, key) {
    const ctx = document.getElementById(id);
    if (!ctx) return;
    const colors = ['#d4be8a', '#b8a06a', '#8a7a5a', '#e2d0a4', '#6a5a4a', '#c0b090'];
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: rows.map(r => r[key] || 'Unbekannt'),
        datasets: [{
          data: rows.map(r => Number(r.views)),
          backgroundColor: colors.slice(0, rows.length),
          borderColor: '#232327',
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#c0c0c4', font: { size: 11 }, padding: 12 }
          }
        }
      }
    });
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
})();

// Floating waffles
(function() {
  var bg = document.getElementById('waffleBg');
  for (var i = 0; i < 15; i++) {
    var el = document.createElement('img');
    el.className = 'waffle-icon';
    el.src = 'img/waffle_icon.svg';
    el.alt = '';
    var size = 30 + Math.random() * 40;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (Math.random() * 92) + '%';
    el.style.top = (Math.random() * 92) + '%';
    el.style.animationDelay = (Math.random() * 15) + 's';
    el.style.animationDuration = (15 + Math.random() * 15) + 's';
    bg.appendChild(el);
  }
})();
</script>
</body>
</html>
